name: SUKISU

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'malkist01/A11K' }
      branch: { description: 'Branch', required: true, default: 'ksu' }
      defconfig: { description: 'Defconfig', required: true, default: 'stock_defconfig' }
      kernelsu_branch: { description: 'KSU Branch', required: false, default: 'builtin' }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.repository }}
        ref: ${{ github.event.inputs.branch }}
        submodules: recursive

    - name: Setup and Build
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 git wget curl
        
        export TZ="Asia/Jakarta"
        echo "BUILD_TIME=$(date +'%H%M-%d%m%y')" >> $GITHUB_ENV

        # Download AOSP Clang r450784d
        mkdir tc
        wget -qO- https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-9.0.0_r3/clang-4691093.tar.gz | tar -xz -C tc
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b master-kernel-build-2021 x64
        git clome https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b master-kernel-build-2021 x32
        export PATH="$PWD/tc/bin:$PWD/x64/bin:$PWD/x32/bin:/bin"
        
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.kernelsu_branch }}

        export ARCH=arm64
        export KBUILD_BUILD_USER="DooPrjkt"
        export KBUILD_BUILD_HOST="github"
        ARGS="O=out ARCH=arm64 CC=clang HOSTCC=clang DTC=dtc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
        
        make $ARGS ${{ github.event.inputs.defconfig }} 2>&1 | tee defconfig.log || true
        make -j$(nproc) $ARGS 2>&1 | tee compile.log || true

        if [ -f out/arch/arm64/boot/Image ]; then
          ZIP_NAME="WIND-KERNEL_B1 ${{ env.BUILD_TIME }}.zip"
          zip -j "$ZIP_NAME" out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/dtbo.img 2>/dev/null || zip -j "$ZIP_NAME" out/arch/arm64/boot/Image.gz-dtb
          echo "FINAL_ZIP=$ZIP_NAME" >> $GITHUB_ENV
        fi

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Result-${{ env.BUILD_TIME }}
        path: |
          *.log
          *.zip
        retention-days: 7
