name: Build Kernel CPH2083

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Timezone
      run: |
        sudo rm /etc/localtime
        sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends python3-pip git zip unzip gcc g++ make ninja-build file bc bison flex libfl-dev libssl-dev libelf-dev wget build-essential python3-dev python3-setuptools rsync ccache llvm-dev libncurses6 libfdt-dev binwalk

    - name: Cache Clang
      uses: actions/cache@v5
      id: cache-clang
      with:
          path: ${{ env.workspace_folder }}/clang
          key: clang-ubuntu-latest
          
    - name: Clone Toolchains
      run: |
        wget https://github.com/ZyCromerZ/Clang/releases/download/10.0.1-20220724-release/Clang-10.0.1-20220724.tar.gz -O clang.tar.gz
        mkdir -p clang && tar -xf clang.tar.gz -C clang
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32    

    - name: Setup Environment Variables
      run: |
        ccache --max-size=2G
        ccache --set-config=compression=true
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d-%m-%Y')" >> $GITHUB_ENV
        echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> $GITHUB_ENV
        echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> $GITHUB_ENV

    - name: Clone KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/malkist02/KernelSU/master/kernel/setup.sh" | bash -s master

    - name: Set Build Start Time
      run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
        export KBUILD_BUILD_USER=Malkist
        export KBUILD_BUILD_HOST=Android
        export KBUILD_COMPILER_STRING="$($CLANG_PATH/bin/clang --version | head -n 1)"
        make O=out ARCH=arm64 stock_defconfig ksu.config
        make -j$(nproc) O=out ARCH=arm64 HOSTCC=clang DTC=dtc CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$GCC64_PATH/bin/aarch64-linux-android- \
          CROSS_COMPILE_ARM32=$GCC32_PATH/bin/arm-linux-gnueabi-
          
    - name: Clone Anykernel3
      run: |
          git clone --depth=1 https://github.com/malkist02/anykernel3 -b CPH2083 AnyKernel3 
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          cd AnyKernel3
          zip -r "../Teletubies-CPH2083-${{ env.BUILD_TIME }}.zip" *
          
    - name: Upload Flashable zip
      uses: actions/upload-artifact@v4
      with:
           name: Teletubies-CPH2083-${{ env.BUILD_TIME }}
           path: AnyKernel3/*
           
    - name: Send to Telegram
      run: |
          curl -X POST "https://api.telegram.org/bot8691384652:AAHbKtOpbMp-Kc9JvKyil4aPsMfo5hdA-F8/sendDocument" \
          -F chat_id=-5173179904 \
          -F message_thread_id=120979 \
          -F document=@"Teletubies-K4.19-mido-${{ env.BUILD_TIME }}.zip" \
          -F caption=" Last Version is Cumming "
