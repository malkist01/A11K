name: Build Kernel Test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Timezone
      run: |
        sudo rm /etc/localtime
        sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends python3-pip git zip unzip gcc g++ gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu lld llvm g++-aarch64-linux-gnu make ninja-build file bc bison flex libfl-dev libssl-dev libelf-dev wget build-essential python3-dev python3-setuptools rsync ccache llvm-dev libncurses6 libfdt-dev binwalk
    - name: Clone Toolchains
      run: |
          git clone https://github.com/rokibhasansagar/linaro-toolchain-latest.git -b latest-7 --depth=1 gcc64
    - name: Set up ccache
      run: |
        ccache --max-size=2G
        ccache --set-config=compression=true
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
    - name: Setup Environment Variables
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d-%m-%Y')" >> $GITHUB_ENV
        echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> $GITHUB_ENV
        echo "EXTRA_FOLDER=$GITHUB_WORKSPACE/extra" >> $GITHUB_ENV
    - name: Clone KernelSU
      run: |
         curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master
    - name: Set Build Start Time
      run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        sed -i '/CONFIG_CC_STACKPROTECTOR_STRONG/d;/CONFIG_CC_STACKPROTECTOR_REGULAR/d;/CONFIG_CC_STACKPROTECTOR_NONE/d' out/.config
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
        sed -i '/CONFIG_KPROBES/d;/CONFIG_HAVE_KPROBES/d;/CONFIG_KPROBE_EVENTS/d;/CONFIG_KSU/d' out/.config
        echo "CONFIG_KPROBES=y" >> out/.config
        echo "CONFIG_HAVE_KPROBES=y" >> out/.config
        echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
        echo "CONFIG_KSU=y" >> out/.config
        export ARCH=arm64
        export PATH="$GCC64_PATH/bin:$PATH"
        export KBUILD_BUILD_USER=Malkist
        export KBUILD_BUILD_HOST=Android
        export KBUILD_COMPILER_STRING="$($GCC64_PATH/bin/gcc --version | head -n 1)"
        make O=out ARCH=arm64 stock_defconfig ksu.config
        make O=out CC=gcc -j"$(nproc --all)" CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS=-Wno-error
          
    - name: Clone Anykernel3
      run: |
          git clone --recursive --depth=1 https://github.com/malkist01/anykernel3 -b CPH2083 AnyKernel3 
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cd AnyKernel3
          zip -r "../Teletubies-KSU-A11K-${{ env.BUILD_TIME }}.zip" *
          
    - name: Upload Flashable zip
      uses: actions/upload-artifact@v4
      with:
           name: Teletubies-KSU-A11K-${{ env.BUILD_TIME }}
           path: AnyKernel3/*
           
    - name: Send to Telegram
      run: |
          curl -X POST "https://api.telegram.org/bot8691384652:AAHbKtOpbMp-Kc9JvKyil4aPsMfo5hdA-F8/sendDocument" \
          -F chat_id=-5173179904 \
          -F message_thread_id=120979 \
          -F document=@"Teletubies-KSU-A11K-${{ env.BUILD_TIME }}.zip" \
          -F caption=" Last Version is Cumming "
